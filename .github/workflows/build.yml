name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y autoconf automake

      - name: Bootstrap
        run: autoreconf -fi

      - name: Configure
        run: ./configure

      - name: Build
        run: make

      - name: Test
        run: make check
